[project]
name = "zhijing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<0.29",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"dev/*.py" = ["E402"]
