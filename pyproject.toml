[project]
name = "zhijing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<0.29",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
